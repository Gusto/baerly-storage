# pnpm 11 reads the postinstall-script allowlist only from this
# file: `package.json#pnpm.*` is no longer honoured. Without this
# map, `pnpm install` exits with `ERR_PNPM_IGNORED_BUILDS` for the
# Cloudflare-stack deps below.
#
# `esbuild` and `workerd` ship working install scripts we want to run.
# Any other package that gains an install script fails the install
# until it is listed here.
allowBuilds:
  esbuild: true
  workerd: true

# Supply-chain guardrails, strict by default — loosen one deliberately:
#   - minimumReleaseAge: don't resolve a version until it has been on
#     the registry a day, closing the publish-then-yank window.
#   - trustPolicy: fail if a package's publishing trust (provenance,
#     trusted publisher) drops below what earlier versions had.
#   - blockExoticSubdeps: only direct deps may come from git or tarballs.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
