name: test-infra

# Deterministic local-container suites (Minio + Postgres + SQLite) that are
# too heavy for the PR hot path but too valuable to leave manual-only.
# Run ON DEMAND via workflow_dispatch, and on pull requests that touch the
# stack definition itself (compose file, docker/ config, this workflow) or the
# code these suites exercise (adapter-node, the CLI export path, the export
# integration tests, the scaffolder's Docker add-on template) — changes `ci`
# cannot catch, since it never starts the containers. Other PRs stay on the
# cheap `ci` job.
#
# NIGHTLY (enabled): the `schedule:` block runs this at 07:00 UTC. A failing
# scheduled run surfaces via GitHub's native scheduled-failure notification to
# the workflow owner (whoever last edited the cron) — no bespoke
# issue-creation step. It also detects a pinned Minio digest the registry
# stops serving, and runs the full-tree `audit` job (never on PRs).
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch: {}
  pull_request:
    paths:
      - docker-compose.yml
      - docker/**
      - .github/workflows/test-infra.yml
      - .github/actions/setup/**
      - packages/create-baerly-storage/templates/addons/docker/**
      - packages/adapter-node/**
      - packages/cli/src/export.ts
      - packages/cli/src/export/**
      - tests/integration/export*

# No cancel-in-progress: for infra runs we want the result, not a
# cancellation (two overlapping manual dispatches — or a manual run
# overlapping the nightly — should not silently kill either run,
# and a cancelled run reads as a failure).
concurrency:
  group: test-infra
  cancel-in-progress: false

permissions:
  contents: read # read-only: no issue-creation, so no issues: write needed

jobs:
  # Full-tree audit (dev dependencies included), nightly and on demand only:
  # it fails on ANY unignored advisory, including ones this repo did not
  # touch, so it must stay off the PR path. Advisories with no patched
  # release are `audit.ignore` entries in pnpm-workspace.yaml, each with an
  # exception register row. Fail closed: no --ignore-registry-errors.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Expiry depends on today's date, so the register is re-checked
      # nightly as well as on every PR (it also runs inside `pnpm verify`).
      # `!cancelled()` on every check step so one red step never hides the
      # others: all of them report, and the job still fails if any one fails.
      - name: Exception register
        if: ${{ !cancelled() }}
        run: node scripts/check-exceptions.ts
      - name: Audit (full tree)
        if: ${{ !cancelled() }}
        run: pnpm audit
      - name: Audit registry signatures
        if: ${{ !cancelled() }}
        run: pnpm audit signatures

  test-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes; don't leave the token in .git/config while
          # install scripts run.
          persist-credentials: false
      - uses: ./.github/actions/setup

      # sqlite3 CLI: test:export-round-trip skips without it.
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--wait` blocks until every service's healthcheck passes (Minio's
      # /minio/health/live, Postgres's in-container `pg_isready`), so an
      # unhealthy container fails HERE — no separate infra probe needed.
      - name: Start storage stack
        run: pnpm dev:storage

      # Gated suites skip green when their environment is missing. Each step
      # names the gate it exists to exercise in BAERLY_REQUIRED_GATES, so
      # the gate manifest (tests/setup/gate-manifest.ts) fails the step if
      # that suite skipped or was never collected.
      - name: Test (adapter-node S3 conformance vs Minio)
        env:
          BAERLY_REQUIRED_GATES: minio
        run: pnpm test:adapter-node

      - name: Test (export smoke → Postgres)
        env:
          BAERLY_REQUIRED_GATES: postgres
        run: pnpm test:export-smoke

      - name: Test (export round-trip → SQLite)
        env:
          BAERLY_REQUIRED_GATES: sqlite
        run: pnpm test:export-round-trip

      # Nothing else builds the scaffolder's Dockerfile template (the unit
      # test only reads its source), so a Dependabot base-image bump would
      # otherwise merge green without ever being built. Scaffold a real
      # Node + docker project with the just-built CLI (outside the
      # workspace, so it installs standalone) and build the image. No boot:
      # a production container refuses to start without a bucket.
      #
      # The scaffold depends on `@gusto/baerly-storage@^<scaffolder version>`
      # from the registry, which does not exist until that version is
      # published (and pnpm's `minimumReleaseAge` holds it back for a day
      # after). So the app installs the packed workspace tarball instead.
      # The Dockerfile copies only the manifests before `pnpm install`, so
      # the Node snippet below also adds a `COPY vendor vendor` line there; everything
      # else in the template is built as shipped.
      - name: Build the Docker add-on template
        run: |
          app="$RUNNER_TEMP/docker-addon-app"
          (cd "$RUNNER_TEMP" && node "$GITHUB_WORKSPACE/packages/create-baerly-storage/dist/index.js" \
            docker-addon-app --target=node --with=docker --pm=pnpm --no-git)
          mkdir "$app/vendor"
          pnpm pack --pack-destination "$app/vendor"
          tarball="$(cd "$app/vendor" && ls gusto-baerly-storage-*.tgz)"
          node -e '
            const fs = require("node:fs");
            const [app, tarball] = process.argv.slice(1);
            const file = app + "/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.dependencies["@gusto/baerly-storage"] = "file:./vendor/" + tarball;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            const manifestCopy = "COPY pnpm-lock.yaml package.json ./\n";
            const dockerfile = fs.readFileSync(app + "/Dockerfile", "utf8");
            if (!dockerfile.includes(manifestCopy)) throw new Error("manifest COPY not found");
            fs.writeFileSync(app + "/Dockerfile", dockerfile.replace(manifestCopy, manifestCopy + "COPY vendor vendor\n"));
          ' "$app" "$tarball"
          (cd "$app" && pnpm install)
          # The image must build from the packed workspace, not a registry
          # copy that happens to resolve; a lockfile that lost the file:
          # specifier would make this step test the wrong package.
          if ! grep -Fq "file:./vendor/" "$app/pnpm-lock.yaml"; then
            echo "::error::pnpm-lock.yaml does not resolve @gusto/baerly-storage from file:./vendor/"
            exit 1
          fi
          docker build "$app"

      - name: Stop storage stack
        if: always()
        run: pnpm dev:storage:stop

      # No issue-creation step: a failed manual run surfaces to whoever
      # triggered the workflow_dispatch (they are watching it), and — if the
      # nightly schedule above is enabled — a failed scheduled run notifies the
      # workflow owner via GitHub's built-in scheduled-failure notification. Add
      # a deduped tracking issue or Slack ping only if that proves missable
      # (see Deferred) — don't build the durable version before the free one
      # has failed.
