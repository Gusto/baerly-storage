# CI gate: credential-free, infra-free. Runs on PRs and merges to main.
# Infra-required tiers (Minio, Postgres, cloud conformance) live in the
# separate `test-infra.yml` workflow (docker-compose stack, dispatch-only),
# kept off the PR hot path.
name: CI

on:
  # PR event covers all feature branches — any push to a branch that has
  # an open PR triggers this workflow once, not twice. CI runs on EVERY PR
  # (no path filter): the job always reports a status, which is what lets it
  # serve as a required status check on main without docs-only PRs hanging on
  # a check that never runs. Docs validation rides along inside `pnpm verify`
  # (verify:docs), so a docs-only PR is still gated here.
  pull_request:
  # Push event covers merges to main (direct push or squash-merge).
  # Combined with the PR trigger above, this avoids double-runs on
  # feature branches: only main merges fire the push path.
  push:
    branches: [main]
  # Manual run button — useful for debugging or re-running without a new commit.
  workflow_dispatch:

# Least-privilege: only reading the repo is needed to run tests.
permissions:
  contents: read

# A new push to the same ref cancels any still-running instance of this
# workflow, saving runner minutes during fast-iteration development.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Upper bound guards against runaway workerd binary downloads or
    # hung vitest workers. The normal suite completes well under 10 min.
    timeout-minutes: 15

    steps:
      # Actions are pinned to a full commit SHA; see
      # .github/actions/setup/action.yml for the policy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26 (current LTS) + pnpm from `devEngines.packageManager`.
      - uses: ./.github/actions/setup

      # `pnpm install` triggers the `prepare` hook (scripts/prepare.mjs),
      # which builds dist/. The Test and Verify-package steps below set
      # BAERLY_SKIP_BUILD=1 so their build-if-needed hooks reuse that dist/
      # instead of re-bundling (rolldown has no output cache, so a second
      # build is a full rebuild, not a no-op).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full static gate: typecheck (tsgo --noEmit), example typechecks,
      # lint (oxlint), format check (oxfmt), import/layer linters, and
      # doc checks. See the `verify` script in package.json.
      - name: Verify
        run: pnpm verify

      # create-baerly-storage's "real git" integration test scaffolds a
      # project and asserts `git init` + an initial commit happened. The
      # scaffolder gracefully SKIPS git-init when no `user.name`/`user.email`
      # is configured (intended product behavior), so on a bare runner —
      # which has git but no identity — it would skip and the test would see
      # no .git/. Configure a CI identity so the happy path is exercised.
      # (Locally the test passes off the developer's ambient global config.)
      - name: Configure git identity (for create-baerly-storage git-init test)
        run: |
          git config --global user.name "baerly-ci"
          git config --global user.email "ci@baerly.invalid"

      # Default vitest project: memory + local-fs suites under pool: forks.
      # Zero infra, no credentials. dist/ is already current from install's
      # prepare build, so skip pretest's rebuild. BAERLY_REQUIRED_GATES names
      # the gated suites this runner can host; the gate manifest
      # (tests/setup/gate-manifest.ts) fails the run if any of them skipped.
      - name: Test
        env:
          BAERLY_SKIP_BUILD: "1"
          BAERLY_REQUIRED_GATES: git
        run: pnpm test

      # Cloudflare adapter tests under @cloudflare/vitest-plugin
      # (miniflare / workerd). No credentials, no external network. The workerd
      # binary ships inside the `@cloudflare/workerd-<platform>` npm package — a
      # normal pnpm dependency — so it's already in the pnpm store the setup
      # action restores (its restore-keys even cover the lockfile-changed
      # case). No separate workerd cache buys anything.
      - name: Test (Cloudflare adapter)
        run: pnpm test:adapter-cloudflare

      # Mutation-testing tripwire, NOT a mutation run: `--dryRunOnly` builds
      # the Stryker sandbox, runs its tsconfig preprocessor, boots the vitest
      # runner and runs the protocol suite once, then stops before testing a
      # single mutant (~20s). The full run stays manual and report-only — see
      # docs/contributing/mutation-testing.md — but its *setup* is fragile in
      # ways no other gate covers: it resolves `typescript` by pnpm hoisting
      # and copies the working tree into a sandbox, so a dependency bump
      # elsewhere in the repo can break `pnpm test:mutate` while every other
      # check stays green. That happened, and went unnoticed for a month.
      - name: Test (mutation dry run)
        run: pnpm run test:mutate:dry-run

      # Packaging-contract gate: attw (every entry point resolves for
      # consumers post-publishConfig rewrite) + publint (both published
      # manifests are well-formed), run against the packed tarball. dist/ is
      # current from install, so skip the rebuild.
      - name: Verify published packages (attw + publint)
        env:
          BAERLY_SKIP_BUILD: "1"
        run: pnpm run verify:package
