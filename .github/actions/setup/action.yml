name: Set up Node and pnpm
description: >-
  Install Node, then the exact pnpm version recorded in pnpm-lock.yaml, and (unless `cache` is "false") restore the pnpm store cache.

# Shared by every workflow job so the toolchain is provisioned one way.
# Actions are pinned to a full commit SHA (not a moving tag) so a
# compromised or force-pushed tag can't silently change what runs in CI
# (cf. the tj-actions/changed-files compromise); the trailing comment
# records the human-readable version — bump both together. Only
# first-party actions/* are used, covered by the org's
# `github_owned_allowed` policy. That policy is a prerequisite: any
# non-`actions/*` action needs an org allow-list request first (the repo
# runs with `allowed_actions: selected`).

inputs:
  node-version:
    description: Node major (or full version) to install.
    default: "26"
  cache:
    description: >-
      Restore and save the pnpm store cache. The release workflow sets "false" so a poisoned cache entry can't reach a published tarball.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    # Node 25+ no longer bundles Corepack, and Corepack rejects the version
    # range in `devEngines.packageManager` anyway, so bootstrap pnpm from the
    # registry. Install the EXACT version pnpm-lock.yaml records under
    # `packageManagerDependencies.pnpm` (not the range), so a pnpm release
    # published minutes ago cannot run in CI before pnpm's own
    # `minimumReleaseAge` / `trustPolicy` apply. pnpm then confirms it
    # against the lockfile (`onFail: "download"`). npm runs from outside
    # the checkout: it applies `devEngines.packageManager` to itself, and a
    # declared pnpm makes it refuse to run (`EBADDEVENGINES`).
    - name: Install pnpm
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        version="$(node -e '
          const lock = require("node:fs").readFileSync(process.argv[1], "utf8");
          const m = /packageManagerDependencies:\s+pnpm:\s+specifier:[^\n]*\n\s+version:\s+(\d+\.\d+\.\d+)\s/.exec(lock);
          if (!m) { console.error("pnpm version not found in pnpm-lock.yaml"); process.exit(1); }
          console.log(m[1]);
        ' "$GITHUB_WORKSPACE/pnpm-lock.yaml")"
        npm install --global "pnpm@${version}"

    - name: Locate pnpm store
      if: inputs.cache == 'true'
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - if: inputs.cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-node${{ inputs.node-version }}-
