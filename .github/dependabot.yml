# Dependabot version updates.
#
# Every ecosystem we pin is covered, so nothing drifts behind silently:
# GitHub Actions (pinned to full commit SHAs, which can't move on their
# own), npm (the pnpm workspace: runtime deps, tooling and the examples),
# the docker-compose dev stack (digest-pinned), and the scaffolder's
# Dockerfile template. Security updates come from the org-level Dependabot
# alert config and are not subject to the cooldowns below.
#
# Version bumps never add a dependency, so they don't conflict with the
# hand-curated runtime footprint (CLAUDE.md anti-patterns); review each
# runtime bump against bundle-sizes.json like any other change.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" scans .github/workflows; the composite setup action lives outside it.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
    # Let a freshly-published action ref "bake" before we propose it. The
    # whole point of SHA-pinning is to resist a compromised or freshly
    # force-pushed release; a cooldown closes the just-published-malicious-
    # release window that a same-day bump would otherwise walk straight into.
    cooldown:
      default-days: 7
    # Group bumps into as few PRs as possible, but keep MAJOR bumps separate:
    # a major (e.g. checkout v7 -> v8) can carry runner-minimum or behavior
    # breaks that deserve their own reviewable PR, while minor/patch flow
    # together as low-risk noise. Dependabot places an update in the first
    # group it matches, so the major group is listed first.
    groups:
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Two groups (major, minor+patch) → at most two grouped PRs in flight.
    # The limit only bites if a group ever fails to group and fans out into
    # per-action PRs; 2 keeps that capped to the intended one-PR-per-group.
    open-pull-requests-limit: 2
    # Review routing is via .github/CODEOWNERS (`/.github/ @baer`), not a
    # `reviewers:` key here — Dependabot removed that option in Aug 2025,
    # replacing it with code owners. CODEOWNERS is what puts a human in
    # front of each new SHA against the upstream release notes.
    commit-message:
      # Conventional Commits, matching the repo style: `ci(deps): bump ...`.
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same reasoning as the Actions cooldown; pnpm's own `minimumReleaseAge`
    # (pnpm-workspace.yaml) is the floor under this.
    cooldown:
      default-days: 7
    groups:
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/packages/create-baerly-storage/templates/addons/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
