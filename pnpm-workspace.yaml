# Since pnpm 11 (declared via `devEngines.packageManager` in
# package.json), every resolution setting — `overrides`,
# `packageExtensions`, `allowBuilds`, `linkWorkspacePackages` —
# belongs in this file, not in a `"pnpm"` field in `package.json`. That
# field is silently inert there: no error, no effect. The tell is `pnpm
# install` printing `Lockfile is up to date, resolution step is skipped`
# when you expected a re-resolve.

packages:
  - .
  - packages/*
  - examples/*

# Strict by default: these guardrails fail the install rather than warn.
# Loosen one deliberately, with a comment, rather than by default.
#   - minimumReleaseAge: don't resolve a version until it has been on the
#     registry a day (pnpm 12's default, stated so it can't drift), which
#     closes the publish-then-yank window most npm compromises live in.
#   - trustPolicy: fail if a package's publishing trust (provenance,
#     trusted publisher) drops below what earlier versions had.
#   - blockExoticSubdeps: only direct deps may come from git or tarball URLs.
#   - engineStrict: fail on a dependency whose `engines` excludes our Node.
#   - strictPeerDependencies: fail on missing or incompatible peers.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
engineStrict: true
strictPeerDependencies: true

# pnpm 11 renamed the postinstall allowlist to `allowBuilds`. Each
# entry is `<pkg>: true|false`: `true` runs the install script,
# `false` skips it without emitting `ERR_PNPM_IGNORED_BUILDS`.
#
# `esbuild`, `lefthook`, and `workerd` ship working install scripts
# we want to run. `sharp` is a transitive dep of `miniflare` whose
# install script falls back to a node-gyp build on Node 24 (no
# prebuilt for our platform/runtime combo), so we suppress it —
# sharp still loads from its prebuilt binary at require time, and
# nothing in this repo exercises its code path directly.
allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true
  sharp: false

# pnpm 10 flipped this default to `false`. Scaffolded apps (and the
# T03 substitute pipeline) write `@baerly/*` deps as literal
# `^0.1.0` semver ranges rather than `workspace:*` — when those land
# inside `examples/` we want them resolved to the local workspace
# member, not fetched from npm (the packages aren't published yet).
# Restoring `true` matches the pnpm-9 behaviour the staged-tarball
# install path in `README.md` relies on.
linkWorkspacePackages: true

# `@baerly/adapter-node` and `@baerly/dev` depend on each other
# (`dev`'s Vite plugin mounts the Node adapter; the Node adapter serves
# `dev`'s landing page). Neither is built on its own. pnpm 12
# refuses to topologically sort a recursive run across a cycle even
# when, as here, neither member has the script being run. Allowing the
# cycle only frees ordering *inside* it; edges outside it (e.g.
# create-baerly-storage -> cli for `build`) stay ordered.
ignoreWorkspaceCycles: true

# Force-resolve transitive dev-tooling deps off versions flagged by
# Dependabot. The alerts are dev-scope and unreachable in our toolchain,
# but no released parent depends on the patched versions yet, so we pin
# them here rather than carry permanently-open alerts:
#   - qs >= 6.15.2: GHSA-q8mj-m7cp-5q26 (stringify DoS), pulled via
#     typed-rest-client -> @stryker-mutator (manual mutation testing).
#   - minimatch >= 11.0.1: GHSA-g3hv-75wg-m249 (globparts DoS), pulled
#     on 9.x via remark-cli -> unified-engine -> glob and on 10.x via
#     @stryker-mutator/core's `~10.2.4`.
#   - glob >= 14.0.2: GHSA-3g3m-2fjr-6pw4 (AbortSignal bypass), pulled
#     on 10.x via remark-cli -> unified-engine (`^10.0.0`).
#   - undici-types 6.x >= 6.23.0: not an advisory but a trust floor.
#     @types/node@22 (pulled by remark-cli -> unified-engine) wants
#     `~6.21.0`, which predates provenance; `trustPolicy: no-downgrade`
#     rejects it because 6.23.0+ ship with provenance. Types only.
overrides:
  qs: ">=6.15.2"
  undici-types@>=6.0.0 <6.23.0: "^6.29.1"
  minimatch@>=7.0.0 <11.0.1: "^11.0.1"
  glob@>=9.0.0 <14.0.2: "^14.0.2"

# Stryker's sandbox rewrites `tsconfig.json` with the classic compiler
# API (`ts.parseConfigFileTextToJson`) but never declares `typescript`,
# so under pnpm the bare specifier falls through to whatever copy is
# hoisted into `.pnpm/node_modules`. That is `typescript@7.0.2` — the Go
# rewrite, whose `.` export is only `lib/version.cjs` (the compiler API
# moved to `typescript/unstable/*`) — dragged in by the examples'
# devDependency. Without this, `pnpm test:mutate` dies in sandbox setup
# with `ts.parseConfigFileTextToJson is not a function` before running a
# single mutant. Giving Stryker its own TypeScript 6 in its pnpm bucket
# resolves ahead of the hoisted copy and leaves the examples on 7. Drop
# it once Stryker supports the TypeScript 7 API.
packageExtensions:
  "@stryker-mutator/core":
    dependencies:
      typescript: ^6.0.3
