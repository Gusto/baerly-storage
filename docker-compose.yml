name: baerly-storage

services:
  minio:
    # MinIO stopped publishing minio/minio (Docker Hub and quay.io) and archived
    # its repo. Chainguard rebuilds MinIO from source; its free tier ships only
    # `latest`, so the digest is the pin. Bump it deliberately.
    image: cgr.dev/chainguard/minio:latest@sha256:18c8fa28697b25e0f34c6faae171079e88a03efb8e76a21d3b5d07b4e3cbef3e
    command: server /data/minio --console-address :9090
    ports:
      - ${BAERLY_MINIO_HOST_PORT:-9102}:9000
      - 9103:9090
    environment:
      MINIO_ROOT_USER: ${BAERLY_MINIO_ROOT_USER:-baerly}
      MINIO_ROOT_PASSWORD: ${BAERLY_MINIO_ROOT_PASSWORD:-baerly-local-dev}
    healthcheck:
      # The image has no curl; `mc ready` probes /minio/health/cluster, and its
      # retry loop is cut off by `timeout` below, so an unready server fails.
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/config.json"]
    ports:
      - ${BAERLY_TOXIPROXY_HOST_PORT:-9104}:9104
      - ${BAERLY_TOXIPROXY_ADMIN_PORT:-8474}:8474
    volumes:
      - ./docker/toxiproxy.json:/etc/toxiproxy/config.json:ro
    environment:
      LOG_LEVEL: debug
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:16.13-alpine
    # Host port 5433 to avoid clashing with a local dev Postgres on 5432.
    ports:
      - ${BAERLY_POSTGRES_HOST_PORT:-5433}:5432
    environment:
      POSTGRES_USER: baerly
      POSTGRES_PASSWORD: baerly-local
      POSTGRES_DB: baerly_export_smoke
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baerly -d baerly_export_smoke"]
      interval: 2s
      timeout: 2s
      retries: 20
